plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ngekosjoss.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ngekosjoss.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        ngekos {
            storeFile file('ngekos.jks')
            storePassword 'ngekos123'
            keyAlias 'ngekos'
            keyPassword 'ngekos123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ngekos
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.ngekos
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
